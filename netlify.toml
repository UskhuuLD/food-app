# Netlify config for the Hono API in server/
# There is no static site — every request is served by one Netlify Function
# (server/netlify/functions/api.mts) and Hono routes it internally.

[build]
  base = "server"
  command = "npm run build --if-present"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # Ship mongoose/mongodb from node_modules instead of bundling them, so
  # esbuild doesn't choke on their optional native deps.
  external_node_modules = ["mongoose", "mongodb"]
